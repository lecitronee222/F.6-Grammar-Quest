<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Quest: F.6 Edition</title>
<style>
  :root {
    --bg-sun: #FFF9C4;
    --ocean-blue: #00838F;
    --deep-ocean: #004D40;
    --sponge-yellow: #FBC02D;
    --coral-pink: #E64A19;
    --card-white: #FFFFFF;
    --text-dark: #212121;
    --dark-brown: #3E2723; /* Rich Dark Brown font for choices */
    --choice-bg: #EFEBE9;   /* Warm light taupe button background */
    --choice-border: #6D4C41; /* Distinct Brown border */
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
  body { background: linear-gradient(180deg, #E0F7FA 0%, #FFF9C4 100%); color: var(--text-dark); min-height: 100vh; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; background: var(--card-white); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); padding: 30px; border: 4px solid var(--sponge-yellow); }
  h1, h2, h3 { color: var(--deep-ocean); text-align: center; margin-bottom: 18px; }
  .screen { display: none; }
  .active { display: block; }
  .avatar-picker { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
  .avatar-card { border: 3px solid #CFD8DC; border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; width: 140px; background: #FAFAFA; color: #263238; font-weight: bold; }
  .avatar-card.selected { border-color: var(--coral-pink); background: #FBE9E7; transform: scale(1.05); }
  .avatar-card .icon { font-size: 50px; }
  input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #78909C; border-radius: 10px; margin: 10px 0; color: #102027; font-weight: 500; }
  button.primary-btn { background: var(--coral-pink); color: #FFFFFF; border: none; border-radius: 10px; padding: 14px 24px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button.primary-btn:hover { background: #BF360C; }
  button.quit-btn { background: #78909C; color: #FFFFFF; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button.quit-btn:hover { background: #D32F2F; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin: 20px 0; }
  .topic-card { background: #E0F2F1; border-radius: 12px; padding: 18px; text-align: center; border: 2px solid #80CBC4; cursor: pointer; transition: 0.2s; }
  .topic-card:hover { background: #B2DFDB; transform: translateY(-2px); }
  .topic-card h4 { color: #004D40; font-size: 18px; margin-bottom: 6px; }
  .topic-card p { color: #37474F; font-size: 14px; font-weight: 600; }
  .leaderboard-table, .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .leaderboard-table th, .leaderboard-table td, .admin-table th, .admin-table td { border: 1px solid #B0BEC5; padding: 10px 12px; text-align: left; }
  .leaderboard-table th, .admin-table th { background: var(--ocean-blue); color: #FFFFFF; font-weight: bold; }
  .leaderboard-table td, .admin-table td { color: #212121; font-weight: 500; }
  
  /* Choice Buttons: Rich Dark Brown Font */
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    margin: 12px 0;
    background: var(--choice-bg);
    border: 2px solid var(--choice-border);
    color: var(--dark-brown) !important;
    padding: 16px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 2px 4px rgba(62,39,35,0.12);
    transition: 0.2s ease;
  }
  .option-btn:hover {
    background: #D7CCC8;
    border-color: #3E2723;
    color: #27120B !important;
    transform: translateX(4px);
  }
  .teacher-btn { position: fixed; bottom: 20px; right: 20px; background: #455A64; border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 2px solid #FFFFFF; box-shadow: 0 4px 10px rgba(0,0,0,0.25); color: #FFFFFF; }
  
  /* Companion Dressing Stage */
  .avatar-dressing-room {
    background: #FFF8E1;
    border: 2px solid #FFD54F;
    border-radius: 15px;
    padding: 18px;
    margin: 15px 0 25px 0;
    display: flex;
    align-items: center;
    gap: 25px;
  }
  .avatar-stage-box {
    position: relative;
    width: 120px;
    height: 120px;
    background: #FFFFFF;
    border: 3px solid #FFA000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(255, 160, 0, 0.2);
    flex-shrink: 0;
  }
  .avatar-character-emoji { font-size: 60px; z-index: 1; }
  .slot-accessory { position: absolute; z-index: 2; font-size: 28px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }
  .slot-head { top: -8px; }
  .slot-chest { bottom: 2px; }
  .slot-left { left: -6px; top: 40px; }
  .slot-right { right: -6px; top: 40px; }
  
  .wardrobe-list { flex-grow: 1; }
  .wardrobe-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .wardrobe-tag {
    background: #FFE082;
    color: #4E342E;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid #FFB300;
  }

  .hud-bar { display: flex; justify-content: space-between; align-items: center; background: #ECEFF1; padding: 12px 18px; border-radius: 10px; margin-bottom: 15px; }
  .badge-display { background: #FFF3E0; border: 2px dashed #FF9800; padding: 15px; border-radius: 12px; margin: 15px 0; text-align: center; color: #4E342E; }
</style>
</head>
