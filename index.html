<style>
  :root {
    --sponge-yellow: #FBC02D;
    --deep-ocean: #004D40;
    --ocean-blue: #00838F;
    --coral-pink: #E64A19;
    --dark-brown: #3E2723;
    --choice-bg: #EFEBE9;

  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
  body { background: linear-gradient(180deg, #E0F7FA 0%, #FFF9C4 100%); color: #212121; min-height: 100vh; padding: 15px; }
  .container { max-width: 880px; margin: 0 auto; background: #FFFFFF; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); padding: 25px; border: 4px solid var(--sponge-yellow); }
  h1, h2, h3 { color: var(--deep-ocean); text-align: center; margin-bottom: 15px; }
  .screen { display: none; }
  .active { display: block; }
  /* Avatar Picker */
  .avatar-picker { display: flex; justify-content: center; gap: 14px; margin: 15px 0; flex-wrap: wrap; }
  .avatar-card { border: 3px solid #CFD8DC; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; width: 140px; background: #FAFAFA; font-weight: bold; }
  .avatar-card.selected { border-color: var(--coral-pink); background: #FBE9E7; transform: scale(1.05); }

  .char-pedestal {

    background: radial-gradient(circle, #FFFFFF 55%, #FFF8E1 100%);
    border: 3px solid #FFA000;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(255, 160, 0, 0.2);
  }
  .doll-body {
    position: relative;
    width: 110px;
    height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .wear-slot {
    position: absolute;
    z-index: 10;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
    transition: all 0.2s ease;
    user-select: none;
  }
  .wear-head { top: -20px; font-size: 32px; left: 50%; transform: translateX(-50%); }
  .wear-torso { top: 58px; font-size: 26px; left: 50%; transform: translateX(-50%); }
  .wear-hand-left { top: 62px; left: -16px; font-size: 24px; }

  .doll-head {

  }
  .doll-face { font-size: 22px; }
  .doll-torso {
    width: 52px; height: 46px; margin-top: -2px; border-radius: 6px;
    position: relative; display: flex; align-items: center; justify-content: center;
    z-index: 1; border: 2px solid rgba(0,0,0,0.15);
  }
  .doll-arm-l, .doll-arm-r {
    position: absolute; top: 8px; width: 12px; height: 36px; border-radius: 6px;
    border: 2px solid rgba(0,0,0,0.15);
  }
  .doll-arm-l { left: -14px; transform: rotate(18deg); }
  .doll-arm-r { right: -14px; transform: rotate(-18deg); }
  .doll-legs { display: flex; gap: 10px; margin-top: -2px; }
  .doll-leg {
    width: 12px; height: 26px; border-radius: 4px; border: 2px solid rgba(0,0,0,0.15); position: relative;
  }
  .doll-leg::after {
    content: ''; position: absolute; bottom: -4px; left: -3px; width: 18px; height: 8px;
    background: #212121; border-radius: 4px;
  }

  .skin-sponge .doll-arm-l, .skin-sponge .doll-arm-r { background: #FFEE58; }
  .skin-sponge .doll-leg { background: #FFEE58; }

  .skin-star .doll-leg { background: #FF8A80; }

  .skin-squid .doll-arm-l, .skin-squid .doll-arm-r { background: #80CBC4; }
  .skin-squid .doll-leg { background: #80CBC4; }
