<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.6 DSE English Grammar Mastery Academy</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0ea5e9;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }
    .btn-primary:hover { background-color: var(--primary-dark); }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text);
    }
    .btn-secondary:hover { background-color: #cbd5e1; }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }
    .btn-danger:hover { background-color: #b91c1c; }

    .btn-teacher {
      background-color: #475569;
      color: #f8fafc;
      font-size: 0.8rem;
    }
    .btn-teacher:hover { background-color: #334155; }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .view-panel {
      display: none;
    }
    .view-panel.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    /* Avatar Preview Box */
    .avatar-showcase {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .avatar-frame {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
    }

    .avatar-gear-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #f59e0b;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wardrobe-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .accessory-chip {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Grid for Topics & Stages */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .topic-card {
      background: white;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    .topic-card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.75rem;
      color: var(--primary-dark);
    }

    .stage-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-stage {
      flex: 1;
      min-width: 45px;
      padding: 0.5rem 0.2rem;
      font-size: 0.85rem;
      text-align: center;
      border-radius: 6px;
      background-color: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid #cbd5e1;
    }

    .btn-stage.unlocked {
      background-color: #dbeafe;
      color: var(--primary-dark);
      border-color: #93c5fd;
      cursor: pointer;
    }

    .btn-stage.cleared {
      background-color: #dcfce7;
      color: #15803d;
      border-color: #86efac;
      cursor: pointer;
    }

    /* Question Screen */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .q-box {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #0f172a;
      min-height: 50px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 600px) {
      .options-grid { grid-template-columns: 1fr; }
    }

    .opt-btn {
      padding: 1rem;
      text-align: left;
      font-size: 1rem;
      border-radius: 8px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .opt-btn.selected {
      border-color: var(--primary);
      background-color: #dbeafe;
      font-weight: 700;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background-color: #e2e8f0;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Review Table */
    .table-container {
      overflow-x: auto;
      margin: 1rem 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
    }

    .badge-correct {
      color: var(--success);
      font-weight: 700;
    }

    .badge-wrong {
      color: var(--danger);
      font-weight: 700;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 650px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
    }
  </style>
</head>

      <button class="btn-teacher" onclick="openTeacherModal()">🔒 Teacher Backdoor</button>
    </div>
  </header>
